[project]
name = "maskco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pierrot LC", email = "pierrotlc@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "flax==0.10.4",
    "jax[cuda12-local]==0.5.0",
    "optax==0.2.4",
    "pybind11>=3.1.0",
    "tensorboardx>=2.6.5",
    "tensorflow-cpu>=2.19.0",
    "torch==2.6.0",
    "tqdm>=4.00.0",
    "triton==3.2.0",
]

[project.scripts]
maskco = "maskco:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
